<!--
  Mentora AI mark: an M on the accent tile, matching the logo in the app.

  The previous file was a 9.5KB violet-and-cyan graphic built from a dozen
  blurred ellipses behind a mask — off-palette, and unreadable once scaled to
  the 16px a browser tab actually draws. A favicon is a 16px problem, so this
  is four strokes and a rounded square.

  Deliberately the same rust in both themes: the tile carries its own
  background, so it stays legible against a light or a dark browser chrome.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#9C4A2F" />
  <path
    d="M9 22V11l7 7 7-7v11"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
