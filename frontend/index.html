<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Colours the browser chrome on mobile to match the page. Updated at
         runtime, so it follows the toggle rather than the OS setting. -->
    <meta name="theme-color" content="#FAF8F3" />

    <!-- SEO meta tags -->
    <meta name="description" content="Learn by teaching. Mentora AI exposes your real knowledge gaps by making you explain concepts to a confused AI student." />
    <meta name="keywords" content="study, AI, learning, Feynman technique, exam preparation" />

    <!-- Open Graph - how your link looks when shared on WhatsApp/Twitter -->
    <meta property="og:title" content="Mentora AI — Learn by Teaching" />
    <meta property="og:description" content="Expose your real knowledge gaps before your exam does." />
    <meta property="og:type" content="website" />

    <!-- Inter for body text, Source Serif 4 for headings. The serif is loaded
         at a variable weight range so headings can be 600 without a second file. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap" rel="stylesheet" />

    <title>Mentora AI — Learn by Teaching</title>

    <!-- Theme, applied before first paint.
         This has to be an inline, blocking script: if React set the theme
         after mounting, a dark-theme visitor would see a white page flash
         first. Wrapped in try/catch because localStorage throws outright in
         some private-browsing modes, and a broken theme must not stop the
         page from rendering. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("mentora-theme")
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) document.documentElement.dataset.theme = "dark"
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute("content", dark ? "#16150F" : "#FAF8F3")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <!-- React mounts your entire app into this div -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
